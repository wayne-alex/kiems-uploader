{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KIEMS Entry - IEBC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      background: #F2F2F7;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --green: #6B9C3F;
      --green-dark: #547B30;
      --green-tint: #EAF3DD;
      --bg: #F2F2F7;
      --surface: #FFFFFF;
      --surface-2: #F7F8F5;
      --ink: #1C1C1E;
      --ink-2: #6E6E73;
      --ink-3: #AEAEB2;
      --border: #E5E5EA;
      --error: #FF3B30;
      --male: #1565c0;
      --female: #c62828;
      --r: 12px;
    }
    .navbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(242,242,247,0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .brand-row img { height: 20px; width: 20px; border-radius: 50%; object-fit: contain; background: white; }
    .brand-row span { font-size: 13px; font-weight: 700; color: var(--green-dark); display: flex; align-items: center; gap: 5px; }
    .title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .date-selector { margin-top: 8px; display: flex; align-items: center; }
    .date-label { font-size: 12px; color: var(--ink-2); margin-right: 8px; display: flex; align-items: center; gap: 4px; }
    .date-input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: var(--surface); color: var(--ink); min-width: 120px; }
    .date-input:focus { outline: 2px solid var(--green); border-color: var(--green); }
    .content { max-width: 420px; margin: 0 auto; padding: 12px 14px 32px; }
    .phase-pill { display: inline-flex; align-items: center; gap: 5px; background: var(--green-tint); color: var(--green-dark); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
    .phase-pill i { font-size: 8px; }
    .who { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 0 0 10px 2px; flex-wrap: wrap; }
    .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--green-tint); color: var(--green-dark); font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .badge-count { font-size: 10px; background: var(--green-tint); color: var(--green-dark); padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .group { background: var(--surface); border-radius: var(--r); overflow: hidden; margin-bottom: 4px; }
    .row { padding: 8px 14px; border-bottom: 0.5px solid var(--border); position: relative; }
    .row:last-child { border-bottom: none; }
    .row label { font-size: 11px; color: var(--ink-2); display: block; margin-bottom: 1px; font-weight: 500; }
    .row select { border: none; outline: none; font-size: 15px; color: var(--ink); background: transparent; width: 100%; -webkit-appearance: none; appearance: none; font-family: inherit; cursor: pointer; padding: 2px 0; }
    .row.select-row::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: translateY(-60%) rotate(45deg); pointer-events: none; }
    .btn-primary { width: 100%; padding: 12px; border: none; border-radius: var(--r); background: var(--green); color: #fff; font-weight: 700; font-size: 14px; margin-top: 8px; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary:active { opacity: 0.75; }
    .btn-primary:disabled { background: #C7C7CC; cursor: not-allowed; }
    .kit-card { background: var(--surface); border-radius: var(--r); border: 0.5px solid var(--border); padding: 12px 14px; margin-bottom: 8px; }
    .kit-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .kit-head-left { display: flex; gap: 8px; flex: 1; min-width: 0; }
    .kit-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; background: var(--green-tint); color: var(--green-dark); }
    .kit-info { flex: 1; min-width: 0; }
    .kit-name { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .kit-serial { font-size: 10px; font-weight: 400; color: var(--ink-3); font-family: monospace; background: var(--bg); padding: 1px 6px; border-radius: 4px; }
    .kit-sub { font-size: 11px; color: var(--ink-2); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
    .edit-btn { display: flex; align-items: center; gap: 4px; background: none; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--ink); font-size: 12px; font-weight: 500; padding: 4px 10px; cursor: pointer; transition: all 0.2s; }
    .edit-btn:hover { background: var(--green-tint); color: var(--green-dark); border-color: var(--green); }
    .stat-row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 0.5px solid var(--border); flex-wrap: wrap; }
    .stat-num { font-size: 20px; font-weight: 700; color: var(--ink); }
    .stat-label { font-size: 11px; color: var(--ink-2); }
    .stat-gender { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); margin: 1px 3px 1px 0; }
    .stat-gender.male { color: var(--male); }
    .stat-gender.female { color: var(--female); }
    .input-row { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; border: 1px solid var(--border); transition: border 0.2s; }
    .input-row:focus-within { border-color: var(--green); background: var(--surface); }
    .input-row i { font-size: 14px; color: var(--ink-3); flex-shrink: 0; }
    .input-row input { border: none; outline: none; background: none; font-size: 13px; color: var(--ink); width: 100%; font-family: inherit; padding: 2px 0; }
    .input-row input::placeholder { color: var(--ink-3); }
    .input-row .gender-label { font-size: 12px; font-weight: 700; flex-shrink: 0; display: flex; align-items: center; }
    .input-row .gender-label.m { color: var(--male); }
    .input-row .gender-label.f { color: var(--female); }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .input-grid .input-row { margin-bottom: 0; }
    .input-grid .input-row input { font-size: 13px; text-align: center; }
    .field-error { color: var(--error); font-size: 11px; margin: 2px 0 4px 2px; }
    .msg-success { display: flex; align-items: center; gap: 6px; color: var(--green-dark); font-size: 13px; font-weight: 600; margin-top: 10px; padding: 10px 14px; background: var(--green-tint); border-radius: var(--r); }
    .msg-error { display: flex; align-items: center; gap: 6px; color: var(--error); font-size: 12px; margin-top: 10px; padding: 10px 14px; background: #FFEBEA; border-radius: var(--r); }
    .hidden { display: none !important; }
    .empty-state { text-align: center; padding: 24px 16px; color: var(--ink-3); }
    .empty-state i { font-size: 32px; display: block; margin-bottom: 8px; }
    .footer-note { display: flex; align-items: center; justify-content: center; gap: 5px; text-align: center; font-size: 10px; color: var(--ink-3); margin-top: 14px; }
    .total-display { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 4px 0; font-size: 12px; color: var(--ink-2); }
    .total-display .num { font-weight: 700; color: var(--green-dark); font-size: 15px; }
    .loading-spinner { text-align: center; padding: 20px; color: var(--ink-3); }
    .loading-spinner i { font-size: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (max-width: 400px) { .content { padding: 8px 10px 24px; } .input-grid { grid-template-columns: 1fr 1fr; gap: 4px; } }
    .date-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--green-tint); color: var(--green-dark); font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 10px; margin-top: 6px; }
    .date-badge i { font-size: 11px; }
    input[readonly] { background: var(--surface-2); cursor: not-allowed; opacity: 0.8; }
    /* summary bar on top */
    .summary-bar {
      background: var(--surface);
      border-radius: var(--r);
      border: 0.5px solid var(--border);
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .summary-bar .total-big {
      font-size: 18px;
      font-weight: 700;
      color: var(--green-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .summary-bar .total-big i { font-size: 18px; }
    .summary-bar .gender-totals {
      display: flex;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .summary-bar .gender-totals span { display: flex; align-items: center; gap: 4px; }
    .summary-bar .gender-totals .m { color: var(--male); }
    .summary-bar .gender-totals .f { color: var(--female); }
    .summary-bar .kit-badge { font-size: 11px; color: var(--ink-2); background: var(--surface-2); padding: 2px 10px; border-radius: 20px; }
    .stat-summary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .stat-summary .stat-item { font-size: 12px; display: flex; align-items: center; gap: 3px; background: var(--surface-2); padding: 2px 8px; border-radius: 12px; }
  </style>
</head>
<body>
<div class="navbar">
  <div class="brand-row">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/92/IEBC_Emblem.png" alt="IEBC">
    <span>IEBC <i class="ti ti-point-filled" style="font-size:6px;"></i> Turbo Constituency</span>
  </div>
  <div class="title">KIEMS Entry</div>
  <div class="date-selector">
    <label class="date-label" for="date-picker"><i class="ti ti-calendar"></i> Date:</label>
    <input type="date" id="date-picker" class="date-input">
  </div>
</div>
<div class="content">
  {% if active_phase %}
  <div class="phase-pill"><i class="ti ti-circle-filled"></i>{{ active_phase.name }}</div>
  {% else %}
  <div class="phase-pill" style="background:#ffebee;color:#c62828;"><i class="ti ti-alert-circle"></i> No active phase</div>
  {% endif %}

  <div id="identify-card">
    <div class="group">
      <div class="row select-row">
        <label>Ward</label>
        <select id="ward-select">
          <option value="">Select ward</option>
          {% for ward in wards %}
          <option value="{{ ward.id }}">{{ ward.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <button id="bind-btn" class="btn-primary" disabled>Continue</button>
    <div id="bind-error" class="msg-error hidden"><i class="ti ti-alert-circle"></i><span></span></div>
  </div>

  <div id="entry-card" class="hidden">
    <div class="who">
      <span class="avatar" id="vra-initials"></span>
      <span id="vra-badge"></span>
      <span class="badge-count" id="kit-count"></span>
    </div>
    <!-- SUMMARY BAR: total kits, total registered, male/female -->
    <div id="summary-bar" class="summary-bar hidden">
      <div class="total-big"><i class="ti ti-users"></i> <span id="summary-total">0</span></div>
      <div class="gender-totals">
        <span class="m">Male: <span id="summary-male">0</span></span>
        <span class="f">Female: <span id="summary-female">0</span></span>
      </div>
      <div class="kit-badge" id="summary-kits">0 kits</div>
    </div>

    <div id="kits-container"><div class="loading-spinner"><i class="ti ti-loader"></i><p>Loading kits...</p></div></div>
    <button id="submit-btn" class="btn-primary"><i class="ti ti-send"></i> Submit All Entries</button>
    <div id="submit-message" class="msg-success hidden"><i class="ti ti-circle-check"></i><span></span></div>
    <div id="form-errors" class="msg-error hidden"><i class="ti ti-alert-circle"></i><span></span></div>
  </div>
  <p class="footer-note"><i class="ti ti-shield-check" style="font-size:11px;"></i> IEBC Turbo Constituency <i class="ti ti-point-filled" style="font-size:6px;"></i> KIEMS Field Reporting</p>
</div>

<script>
const CSRF = "{{ csrf_token }}";
function getDeviceToken() {
  let t = localStorage.getItem('vra_device_token');
  if (!t) { t = crypto.randomUUID(); localStorage.setItem('vra_device_token', t); }
  return t;
}
const token = getDeviceToken();
let currentVRA = null;
let kitsData = [];

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}
function setMsgBox(el, text) {
  const span = el.querySelector('span');
  if (span) span.textContent = text; else el.textContent = text;
  el.classList.remove('hidden');
}

async function resolveVRA() {
  try {
    const res = await fetch(`/kiems/resolve-vra/?token=${token}`);
    const data = await res.json();
    if (data.bound) {
      currentVRA = data;
      await enterForm();
    }
  } catch (e) { console.error(e); }
}

function initDatePicker() {
  const picker = document.getElementById('date-picker');
  const today = new Date().toISOString().split('T')[0];
  picker.value = today;
  picker.addEventListener('change', loadKits);
}

document.getElementById('ward-select').addEventListener('change', (e) => {
  document.getElementById('bind-btn').disabled = !e.target.value;
});

document.getElementById('bind-btn').addEventListener('click', async () => {
  const wardId = document.getElementById('ward-select').value;
  const btn = document.getElementById('bind-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Loading...';
  try {
    const res = await fetch('/kiems/bind-ward/', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `token=${token}&ward_id=${wardId}`
    });
    const data = await res.json();
    const errBox = document.getElementById('bind-error');
    if (!data.ok) {
      setMsgBox(errBox, data.error);
      btn.disabled = false;
      btn.innerHTML = 'Continue';
      return;
    }
    errBox.classList.add('hidden');
    currentVRA = data;
    await enterForm();
  } catch (e) {
    setMsgBox(document.getElementById('bind-error'), 'Network error. Please try again.');
    btn.disabled = false;
    btn.innerHTML = 'Continue';
  }
});

async function enterForm() {
  document.getElementById('identify-card').classList.add('hidden');
  document.getElementById('entry-card').classList.remove('hidden');
  document.getElementById('vra-badge').textContent = `${currentVRA.vra_name} - ${currentVRA.ward_name}`;
  document.getElementById('vra-initials').textContent = initials(currentVRA.vra_name);
  await loadKits();
}

async function loadKits() {
  const container = document.getElementById('kits-container');
  container.innerHTML = `<div class="loading-spinner"><i class="ti ti-loader"></i><p>Loading kits...</p></div>`;
  try {
    const datePicker = document.getElementById('date-picker');
    const selectedDate = datePicker.value;
    const res = await fetch(`/kiems/kits-with-entries/?token=${token}&date=${selectedDate}`);
    const data = await res.json();
    if (data.error) {
      container.innerHTML = `<div class="empty-state"><i class="ti ti-alert-circle"></i><p style="color:var(--error);">${data.error}</p></div>`;
      document.getElementById('summary-bar').classList.add('hidden');
      return;
    }
    kitsData = data.kits || [];
    document.getElementById('kit-count').textContent = `${kitsData.length} kits`;
    if (kitsData.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="ti ti-device-tablet-off"></i><p>No KIEMS kits assigned to this ward</p><p style="font-size:11px;margin-top:4px;">Ward: ${data.ward_name || 'Unknown'}</p></div>`;
      document.getElementById('summary-bar').classList.add('hidden');
      return;
    }
    renderKits();
    updateSummary();
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><i class="ti ti-alert-circle"></i><p style="color:var(--error);">Error loading kits. Please refresh.</p></div>`;
    document.getElementById('summary-bar').classList.add('hidden');
  }
}

function renderKits() {
  const container = document.getElementById('kits-container');
  const datePicker = document.getElementById('date-picker');
  const selectedDate = datePicker.value;
  const today = new Date().toISOString().split('T')[0];
  const isToday = selectedDate === today;

  container.innerHTML = kitsData.map(kit => {
    if (!isToday) return summaryCard(kit, true);
    if (kit.has_entry && !kit._editing) return summaryCard(kit, false);
    return formCard(kit);
  }).join('');

  if (isToday) {
    container.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const kit = kitsData.find(k => k.kit_id == btn.dataset.kit);
        if (kit) { kit._editing = true; renderKits(); updateSummary(); }
      });
    });
  }

  container.querySelectorAll('.kit-card').forEach(card => {
    const maleInput = card.querySelector('.male-input');
    const femaleInput = card.querySelector('.female-input');
    const totalSpan = card.querySelector('.num');
    if (maleInput && femaleInput && totalSpan) {
      function updateTotal() {
        const m = parseInt(maleInput.value) || 0;
        const f = parseInt(femaleInput.value) || 0;
        totalSpan.textContent = m + f;
        updateSummary();
      }
      maleInput.addEventListener('input', updateTotal);
      femaleInput.addEventListener('input', updateTotal);
      updateTotal();
    }
  });

  document.getElementById('summary-bar').classList.remove('hidden');
}

function summaryCard(kit, isPast) {
  const total = (kit.registered_male || 0) + (kit.registered_female || 0);
  const editBtn = isPast ? '' : `<button class="edit-btn" data-kit="${kit.kit_id}"><i class="ti ti-pencil"></i> Edit</button>`;
  return `
  <div class="kit-card" data-kit="${kit.kit_id}">
    <div class="kit-head">
      <div class="kit-head-left">
        <div class="kit-icon"><i class="ti ti-check"></i></div>
        <div class="kit-info">
          <div class="kit-name">${kit.kit_name} <span class="kit-serial">${kit.serial_no}</span></div>
          <div class="kit-sub"><i class="ti ti-map-pin"></i>${kit.venue}</div>
        </div>
      </div>
      ${editBtn}
    </div>
    <div class="stat-row">
      <span class="stat-num">${total}</span>
      <span class="stat-label">registered</span>
      <span class="stat-gender male">Male: ${kit.registered_male || 0}</span>
      <span class="stat-gender female">Female: ${kit.registered_female || 0}</span>
    </div>
    ${isPast ? `<div class="date-badge"><i class="ti ti-calendar"></i>Viewing ${kit.selected_date || ''}</div>` : ''}
  </div>`;
}

function formCard(kit) {
  const defaultVenue = kit.venue || (currentVRA ? currentVRA.ward_name : '') || '';
  return `
  <div class="kit-card" data-kit="${kit.kit_id}">
    <div class="kit-head">
      <div class="kit-head-left">
        <div class="kit-icon"><i class="ti ti-device-tablet"></i></div>
        <div class="kit-info">
          <div class="kit-name">${kit.kit_name} <span class="kit-serial">${kit.serial_no}</span></div>
          <div class="kit-sub"><i class="ti ti-circle-dashed"></i> ${kit.has_entry ? 'Editing current' : 'Not submitted today'}</div>
        </div>
      </div>
    </div>
    <div class="input-row">
      <i class="ti ti-map-pin"></i>
      <input class="venue-input" data-kit="${kit.kit_id}" value="${defaultVenue}" placeholder="Venue" style="font-size:13px;">
    </div>
    <div class="input-grid">
      <div class="input-row" style="border-left: 2px solid var(--male);">
        <span class="gender-label m">Male</span>
        <input class="male-input" type="number" min="0" inputmode="numeric" value="${kit.registered_male || 0}" placeholder="Male" style="text-align:center;font-size:13px;">
      </div>
      <div class="input-row" style="border-left: 2px solid var(--female);">
        <span class="gender-label f">Female</span>
        <input class="female-input" type="number" min="0" inputmode="numeric" value="${kit.registered_female || 0}" placeholder="Female" style="text-align:center;font-size:13px;">
      </div>
    </div>
    <div class="total-display">
      <span>Total:</span>
      <span class="num">${(kit.registered_male || 0) + (kit.registered_female || 0)}</span>
    </div>
    <div class="field-error hidden" id="err-${kit.kit_id}"></div>
  </div>`;
}

function updateSummary() {
  let totalMale = 0, totalFemale = 0;
  const cards = document.querySelectorAll('.kit-card');

  cards.forEach(card => {
    const maleInput = card.querySelector('.male-input');
    const femaleInput = card.querySelector('.female-input');

    if (maleInput && femaleInput) {
      totalMale += parseInt(maleInput.value) || 0;
      totalFemale += parseInt(femaleInput.value) || 0;
    } else {
      const kitId = card.dataset.kit;
      if (kitId) {
        const kit = kitsData.find(k => k.kit_id == kitId);
        if (kit) {
          totalMale += parseInt(kit.registered_male) || 0;
          totalFemale += parseInt(kit.registered_female) || 0;
        }
      }
    }
  });

  if (cards.length === 0) {
    kitsData.forEach(k => {
      totalMale += parseInt(k.registered_male) || 0;
      totalFemale += parseInt(k.registered_female) || 0;
    });
  }

  const total = totalMale + totalFemale;
  document.getElementById('summary-total').textContent = total;
  document.getElementById('summary-male').textContent = totalMale;
  document.getElementById('summary-female').textContent = totalFemale;
  document.getElementById('summary-kits').textContent = `${kitsData.length} kits`;
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  const kitCards = document.querySelectorAll('.kit-card');
  const body = new URLSearchParams();
  body.append('token', token);
  let hasEntries = false;
  let valid = true;
  let firstError = null;

  kitCards.forEach(card => {
    const venue = card.querySelector('.venue-input')?.value.trim();
    const male = card.querySelector('.male-input')?.value.trim();
    const female = card.querySelector('.female-input')?.value.trim();
    const kitId = card.querySelector('.venue-input')?.dataset.kit;
    if (!kitId) return;
    const maleNum = parseInt(male) || 0;
    const femaleNum = parseInt(female) || 0;

    if (card.querySelector('.venue-input') && !card.querySelector('.venue-input')?.readOnly) {
      hasEntries = true;
      if (!venue) {
        valid = false;
        const errEl = document.getElementById(`err-${kitId}`);
        if (errEl) { errEl.textContent = 'Venue required.'; errEl.classList.remove('hidden'); }
        if (!firstError) firstError = 'Venue required for all kits.';
      } else if (maleNum === 0 && femaleNum === 0) {
        valid = false;
        const errEl = document.getElementById(`err-${kitId}`);
        if (errEl) { errEl.textContent = 'Enter at least one voter.'; errEl.classList.remove('hidden'); }
        if (!firstError) firstError = 'Each kit needs at least one registered voter.';
      } else {
        body.append('kit_id[]', kitId);
        body.append('venue[]', venue);
        body.append('registered_male[]', maleNum);
        body.append('registered_female[]', femaleNum);
      }
    }
  });

  if (!hasEntries) {
    setMsgBox(document.getElementById('submit-message'), 'No editable entries to submit.');
    return;
  }
  if (!valid) {
    setMsgBox(document.getElementById('form-errors'), firstError || 'Please fix highlighted errors.');
    document.getElementById('submit-message').classList.add('hidden');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Submitting...';
  try {
    const res = await fetch('/kiems/submit-entries/', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const data = await res.json();
    const msg = document.getElementById('submit-message');
    const errBox = document.getElementById('form-errors');
    if (data.ok) {
      setMsgBox(msg, `Successfully submitted ${data.saved} entries!`);
      errBox.classList.add('hidden');
      await loadKits();
    } else {
      msg.classList.add('hidden');
      setMsgBox(errBox, `${data.saved || 0} entries saved. Review highlighted issues.`);
    }
  } catch (e) {
    setMsgBox(document.getElementById('form-errors'), 'Network error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i> Submit All Entries';
  }
});

resolveVRA();
initDatePicker();
</script>
</body>
</html>
