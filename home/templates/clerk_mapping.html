{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clerk KIEMS Venue Mapping</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- FingerprintJS (open-source build) -->
  <script src="https://openfpcdn.io/fingerprintjs/v4/iife.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      background: #F0F1EC;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
      line-height: 1.3;
    }
    :root {
      --green: #6B9C3F;
      --green-dark: #4C7128;
      --green-tint: #EAF3DD;
      --green-glow: rgba(107,156,63,0.15);
      --ink-stamp: #2F5A18;
      --bg: #F0F1EC;
      --surface: #FFFFFF;
      --surface-2: #F6F6F2;
      --paper: #FCFBF7;
      --ink: #1C1C1E;
      --ink-2: #6E6E73;
      --ink-3: #ACACA8;
      --border: #E7E7E2;
      --border-dash: #D8D8D2;
      --error: #D3372A;
      --error-tint: #FBE8E6;
      --male: #1E5FA8;
      --male-tint: #E9F1FB;
      --female: #B23A32;
      --female-tint: #FBEAE8;
      --r: 13px;
      --r-lg: 20px;
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
      --shadow-sm: 0 1px 2px rgba(28,28,30,0.05);
      --shadow-md: 0 8px 22px rgba(28,28,30,0.08), 0 1px 3px rgba(28,28,30,0.05);
      --shadow-lg: 0 24px 60px rgba(20,22,18,0.22), 0 6px 16px rgba(20,22,18,0.10);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .navbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(240,241,236,0.86);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
    }
    .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .brand-row img { height: 18px; width: 18px; border-radius: 50%; object-fit: contain; background: white; }
    .brand-row span { font-size: 11.5px; font-weight: 700; color: var(--green-dark); display: flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
    .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.4px; margin: 0; line-height: 1.15; }
    .content { max-width: 780px; margin: 0 auto; padding: 12px 14px 36px; }
    .group { background: var(--surface); border-radius: var(--r); overflow: hidden; margin-bottom: 4px; box-shadow: var(--shadow-sm); }
    .row { padding: 9px 14px; border-bottom: 0.5px solid var(--border); position: relative; }
    .row:last-child { border-bottom: none; }
    .row label { font-size: 10px; color: var(--ink-2); display: block; margin-bottom: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .row select { border: none; outline: none; font-size: 14.5px; color: var(--ink); background: transparent; width: 100%; -webkit-appearance: none; appearance: none; font-family: inherit; cursor: pointer; padding: 1px 0; font-weight: 500; }
    .row.select-row::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: translateY(-60%) rotate(45deg); pointer-events: none; }
    .btn-primary {
      padding: 8px 16px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(180deg, #78ab4c, var(--green));
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: transform .15s var(--ease), opacity .15s var(--ease), box-shadow .15s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(107,156,63,0.25);
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }
    .btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary:disabled { background: #D1D1D6; box-shadow: none; cursor: not-allowed; opacity: 0.7; }
    .btn-primary.small { padding: 5px 12px; font-size: 11px; }
    .btn-primary.success { background: var(--green-dark); }

    .btn-secondary {
      width: 100%; padding: 12px; border: none; border-radius: 11px;
      background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 14px;
      cursor: pointer; transition: background .15s var(--ease), transform .15s var(--ease);
      display: flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit;
      border: 1px solid var(--border);
    }
    .btn-secondary:active { transform: scale(0.98); background: #EFEFEA; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    .spin { animation: spin 0.85s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .msg-success { display: flex; align-items: center; gap: 6px; color: var(--green-dark); font-size: 12px; font-weight: 600; margin-top: 6px; padding: 8px 12px; background: var(--green-tint); border-radius: var(--r); }
    .msg-error { display: flex; align-items: center; gap: 6px; color: var(--error); font-size: 11.5px; margin-top: 6px; padding: 8px 12px; background: var(--error-tint); border-radius: var(--r); }
    .hidden { display: none !important; }
    .empty-state { text-align: center; padding: 28px 16px; color: var(--ink-3); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); }
    .empty-state i { font-size: 30px; display: block; margin-bottom: 8px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .footer-note { display: flex; align-items: center; justify-content: center; gap: 5px; text-align: center; font-size: 9.5px; color: var(--ink-3); margin-top: 14px; }
    .loading-spinner { text-align: center; padding: 24px; color: var(--ink-3); }
    .loading-spinner i { font-size: 22px; animation: spin 1s linear infinite; display: inline-block; }
    @media (max-width: 400px) { .content { padding: 9px 10px 24px; } }
    input[readonly] { background: var(--surface-2); cursor: not-allowed; opacity: 0.8; }

    /* ==================== Selection Summary (Ward / Kit) ==================== */
    .selection-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }
    .selection-summary-info {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      row-gap: 6px;
    }
    .selection-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .selection-item i { color: var(--green-dark); font-size: 15px; }
    .selection-item .selection-label {
      font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
      color: var(--ink-3); margin-right: 2px;
    }
    .selection-item .serial-tag {
      font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--ink-2);
      background: var(--surface-2); padding: 1px 7px; border-radius: 8px;
    }
    .change-selection-btn { width: auto; padding: 8px 14px; flex-shrink: 0; }

    /* ==================== Records header (title + add button) ==================== */
    .records-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg);
      padding: 6px 0 8px;
      margin-bottom: 2px;
    }
    .records-header h2 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      color: var(--ink);
    }
    .add-entry-btn-top {
      padding: 8px 14px;
      flex-shrink: 0;
    }

    /* ==================== Floating add button (visible while scrolling) ==================== */
    .fab-add {
      position: fixed;
      right: 18px;
      bottom: 22px;
      z-index: 50;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(180deg, #78ab4c, var(--green));
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(76,113,40,0.35), 0 2px 8px rgba(28,28,30,0.15);
      transition: transform .15s var(--ease), opacity .15s var(--ease);
    }
    .fab-add:active { transform: scale(0.94); }
    .fab-add.hidden { display: none !important; }

    /* ==================== Toolbar (search) ==================== */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      box-shadow: var(--shadow-sm);
    }
    .search-box i { color: var(--ink-3); font-size: 14px; }
    .search-box input {
      border: none; outline: none; background: none; font-size: 13px;
      font-family: inherit; width: 100%; color: var(--ink);
    }
    .search-box .clear-search { cursor: pointer; color: var(--ink-3); font-size: 13px; display: none; }
    .search-box .clear-search.show { display: inline-flex; }

    /* ==================== Clerk Profile ==================== */
    .clerk-profile {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, var(--green-tint), #d4e8bf);
      border-radius: var(--r-lg); padding: 10px 16px; margin-bottom: 12px;
      border: 1px solid rgba(107,156,63,0.2); box-shadow: 0 2px 8px rgba(107,156,63,0.08);
    }
    .clerk-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex; align-items: center; justify-content: center; color: #fff;
      font-weight: 700; font-size: 16px; flex-shrink: 0; font-family: var(--mono);
      box-shadow: 0 2px 8px rgba(76,113,40,0.25);
    }
    .clerk-details { flex: 1; min-width: 0; }
    .clerk-details .clerk-name {
      font-weight: 700; font-size: 15px; color: var(--ink);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .clerk-details .clerk-name .badge-verified {
      font-size: 9px; background: var(--green); color: #fff; padding: 1px 8px;
      border-radius: 12px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase;
    }
    .clerk-details .clerk-ward { font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
    .clerk-details .clerk-ward i { font-size: 12px; }
    .clerk-status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      display: inline-block; flex-shrink: 0; animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }

    /* ==================== Device message ==================== */
    .device-locked { text-align: center; padding: 20px 16px; border-radius: var(--r); margin-bottom: 10px; }
    .device-locked.error { background: var(--error-tint); color: var(--error); }
    .device-locked.success { background: var(--green-tint); color: var(--green-dark); }
    .device-locked.info { background: var(--surface-2); color: var(--ink-2); }
    .device-locked i { font-size: 26px; display: block; margin-bottom: 6px; }
    .device-locked h3 { margin: 0 0 4px; font-size: 14px; }
    .device-locked p { margin: 0 0 8px; font-size: 12.5px; }
    .device-locked .lock-code { font-family: var(--mono); font-size: 10.5px; opacity: 0.75; }
    .device-info-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-2); padding: 6px 2px; margin-bottom: 6px; }

    /* Summary badge in records card */
    .summary-badge {
        display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 0 10px 0;
        font-size: 11px; color: var(--ink-2); border-bottom: 1px solid var(--border-dash); margin-bottom: 10px;
    }
    .summary-badge span { display: inline-flex; align-items: center; gap: 4px; }
    .summary-badge .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .summary-badge .dot.green { background: var(--green-dark); }
    .summary-badge .dot.orange { background: #A5690C; }

    /* ==================== Records table ==================== */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--r);
      box-shadow: var(--shadow-sm);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .records-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
    .records-table thead th {
      text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
      color: var(--ink-2); background: var(--surface-2); padding: 9px 10px;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .records-table tbody td { padding: 7px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
    .records-table tbody tr:hover { background: rgba(107,156,63,0.04); }
    .records-table tr.new-row td { background: var(--green-tint); }
    .records-table tr.new-row:hover td { background: var(--green-tint); }
    .records-table input.venue-cell-input,
    .records-table input.date-cell-input {
      border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-size: 12.5px;
      width: 100%; font-family: inherit; background: var(--surface); color: var(--ink);
    }
    .records-table input.date-cell-input:disabled { background: var(--surface-2); color: var(--ink-2); opacity: 0.85; }
    .records-table input.venue-cell-input:focus,
    .records-table input.date-cell-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
    .records-table input.venue-cell-input.changed { border-color: var(--green); background: var(--green-tint); }
    .records-table input.venue-cell-input[readonly] {
      background: transparent; border-color: transparent; color: var(--ink);
      cursor: default; padding-left: 2px; font-weight: 500;
    }
    .records-table input.venue-cell-input[readonly]::placeholder { color: var(--ink-3); }
    .records-table .time-cell { color: var(--ink-2); white-space: nowrap; font-size: 11.5px; font-family: var(--mono); }
    .records-table .day-cell { color: var(--ink-2); font-size: 11.5px; white-space: nowrap; }
    .records-table .status-cell { white-space: nowrap; }
    .records-table .entry-status {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
      padding: 2px 8px; border-radius: 12px; display: inline-block;
    }
    .records-table .entry-status.saved { background: var(--green-tint); color: var(--green-dark); }
    .records-table .entry-status.pending { background: #FFF4DE; color: #A5690C; }
    .records-table .entry-status.editing { background: #E3F0FF; color: #1E5FA8; }
    .records-table .action-cell { white-space: nowrap; text-align: right; }
    .records-table .row-save-btn,
    .records-table .row-edit-btn { padding: 5px 10px; font-size: 10.5px; }
    .records-table .row-edit-btn { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
    .records-table .row-edit-btn:hover { border-color: var(--green); color: var(--ink); }
    .records-table .save-feedback { font-size: 9.5px; display: block; margin-top: 3px; text-align: right; }
    .records-table .save-feedback.success { color: var(--green-dark); }
    .records-table .save-feedback.error { color: var(--error); }
    .loading-cell, .empty-cell { text-align: center; padding: 22px; color: var(--ink-3); }

    /* ==================== Bottom bar (scroll-to-top only) ==================== */
    .bottom-bar { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }

    /* ==================== Responsive ==================== */
    @media (max-width: 400px) {
      .clerk-profile { flex-wrap: wrap; gap: 8px; }
      .clerk-avatar { width: 32px; height: 32px; font-size: 13px; }
      .clerk-details .clerk-name { font-size: 13px; }
      .selection-summary { flex-direction: column; align-items: flex-start; }
      .change-selection-btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="navbar">
  <div class="brand-row">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/92/IEBC_Emblem.png" alt="IEBC">
    <span>IEBC <i class="ti ti-point-filled" style="font-size:5px;"></i> Turbo Constituency</span>
  </div>
  <div class="title">Clerk Venue Mapping</div>
</div>
<div class="content">
  <!-- Device Lock/Error Messages -->
  <div id="device-message-container"></div>

  <!-- Device Info Bar -->
  <div id="device-info-bar" class="device-info-bar hidden">
    <span id="device-status-text">Device: <span id="device-status-label">Unknown</span></span>
    <span id="device-id-display" style="font-family:'JetBrains Mono',monospace;font-size:9.5px;"></span>
    <span style="font-size:9px; color:var(--ink-3); margin-left:auto;" id="lastUpdated">Last updated: --</span>
  </div>

  <!-- Clerk Profile -->
  <div id="clerk-profile-container" class="hidden">
    <div class="clerk-profile">
      <div class="clerk-avatar" id="clerk-avatar">?</div>
      <div class="clerk-details">
        <div class="clerk-name">
          <span id="clerk-name-display">Clerk</span>
          <span class="badge-verified"><i class="ti ti-check" style="font-size:8px;"></i> Verified</span>
        </div>
        <div class="clerk-ward">
          <i class="ti ti-map-pin"></i>
          <span id="clerk-ward-display">Ward</span>
          <span class="clerk-status-dot"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="identify-card">
    <div class="group">
      <div class="row select-row">
        <label>Ward</label>
        <select id="ward-select">
          <option value="">Select ward</option>
        </select>
      </div>
      <div id="ward-error" class="msg-error hidden"><i class="ti ti-alert-circle"></i><span></span></div>
    </div>
    <div class="group" style="margin-top:8px;">
      <button id="load-kits-btn" class="btn-primary" style="width:100%;" disabled>Load Kits</button>
      <button id="retry-wards-btn" class="btn-secondary" style="display:none;">Retry Wards</button>
    </div>
    <div id="bind-error" class="msg-error hidden"><i class="ti ti-alert-circle"></i><span></span></div>
  </div>

  <div id="kit-selection-card" class="hidden">
    <div class="group">
      <div class="row select-row">
        <label>KIEMS Kit</label>
        <select id="kit-select">
          <option value="">Select kit</option>
        </select>
      </div>
    </div>
    <button id="load-records-btn" class="btn-primary" style="width:100%;" disabled>Load Records</button>
    <div id="kit-error" class="msg-error hidden"><i class="ti ti-alert-circle"></i><span></span></div>
  </div>

  <!-- Compact summary shown once a kit's records are loaded, replacing the selects above -->
  <div id="selection-summary" class="selection-summary hidden">
    <div class="selection-summary-info">
      <div class="selection-item">
        <i class="ti ti-map-pin"></i>
        <span class="selection-label">Ward</span>
        <span id="summary-ward-name">—</span>
      </div>
      <div class="selection-item">
        <i class="ti ti-device-desktop"></i>
        <span class="selection-label">Kit</span>
        <span id="summary-kit-name">—</span>
        <span class="serial-tag" id="summary-kit-serial"></span>
      </div>
    </div>
    <button id="change-selection-btn" class="btn-secondary change-selection-btn">
      <i class="ti ti-arrow-left"></i> Change Ward / Kit
    </button>
  </div>

  <div id="records-card" class="hidden">
    <!-- Header: title + Add Entry (top-right, sticky) -->
    <div class="records-header">
      <h2>Venue Entries</h2>
      <button id="add-row-btn-top" class="btn-primary add-entry-btn-top">
        <i class="ti ti-plus"></i> Add Entry
      </button>
    </div>

    <!-- Toolbar: search -->
    <div class="toolbar">
      <div class="search-box">
        <i class="ti ti-search"></i>
        <input type="text" id="venue-search" placeholder="Search venue...">
        <i class="ti ti-x clear-search" id="clear-search-btn"></i>
      </div>
    </div>

    <!-- Summary Badge -->
    <div class="summary-badge" id="summaryBadge">
      <span><span class="dot green"></span> <span id="savedCount">0</span> saved</span>
      <span><span class="dot orange"></span> <span id="pendingCount">0</span> pending</span>
      <span id="filterLabel" style="margin-left:auto; font-size:9px; color:var(--ink-3);">All records</span>
    </div>

    <!-- Records Table -->
    <div class="table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Day</th>
            <th>Venue</th>
            <th>Time</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="records-tbody">
          <tr><td colspan="6" class="loading-cell"><i class="ti ti-loader spin"></i> Loading records...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="bottom-bar">
      <button id="scroll-top-btn" class="btn-secondary" style="width:auto; padding:8px 14px;">
        <i class="ti ti-arrow-up"></i> Back to top
      </button>
    </div>

  <!-- Floating Add Entry button — stays visible while scrolling a long list -->

  <p class="footer-note"><i class="ti ti-shield-check" style="font-size:10px;"></i> IEBC Turbo Constituency <i class="ti ti-point-filled" style="font-size:5px;"></i> Clerk Venue Tool</p>
</div>

<script>
// ============================================================
// FIXED OPERATING HOURS (display-only, per requirement)
// ============================================================
const FIXED_TIME_LABEL = '8:00 AM – 5:00 PM';

// ============================================================
// DEVICE FINGERPRINTING SYSTEM (Using FingerprintJS)
// ============================================================

class DeviceFingerprint {
  constructor() {
    this.fingerprint = null;
    this.burnData = null;
    this.initialized = false;
    this.fpInstance = null;
    this.fingerprintData = null;
  }

  async initialize() {
    if (this.initialized) return this;
    try {
      this.fpInstance = await FingerprintJS.load();
    } catch (error) {
      console.warn('FingerprintJS failed to load, falling back to basic fingerprint:', error);
      return this.fallbackInitialize();
    }
    try {
      const result = await this.fpInstance.get();
      this.fingerprintData = result;
      this.fingerprint = result.visitorId;
      const components = result.components || [];
      this.fingerprintDetails = this.extractFingerprintDetails(components);
      localStorage.setItem('device_fingerprint', this.fingerprint);
      localStorage.setItem('device_fingerprint_details', JSON.stringify(this.fingerprintDetails));
      this.burnData = this.getBurnData();
      this.initialized = true;
      return this;
    } catch (error) {
      console.error('FingerprintJS get failed:', error);
      return this.fallbackInitialize();
    }
  }

  fallbackInitialize() {
    this.fingerprint = this.generateBasicFingerprint();
    this.fingerprintDetails = this.getBasicFingerprintDetails();
    localStorage.setItem('device_fingerprint', this.fingerprint);
    localStorage.setItem('device_fingerprint_details', JSON.stringify(this.fingerprintDetails));
    this.burnData = this.getBurnData();
    this.initialized = true;
    return this;
  }

  generateBasicFingerprint() {
    const data = {
      userAgent: navigator.userAgent,
      screenWidth: screen.width,
      screenHeight: screen.height,
      colorDepth: screen.colorDepth,
      language: navigator.language,
      platform: navigator.platform,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      canvasFingerprint: this.getCanvasFingerprint(),
      webglFingerprint: this.getWebGLFingerprint()
    };
    const str = JSON.stringify(data);
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const char = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash = hash & hash;
    }
    return hash.toString(36);
  }

  getCanvasFingerprint() {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 200;
      canvas.height = 50;
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(125, 1, 62, 20);
      ctx.fillStyle = '#069';
      ctx.fillText('KIEMS Fingerprint', 2, 15);
      ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
      ctx.fillText('IEBC', 4, 17);
      return canvas.toDataURL();
    } catch(e) {
      return 'canvas_error';
    }
  }

  getWebGLFingerprint() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return 'webgl_not_supported';
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (!debugInfo) return 'webgl_debug_not_available';
      const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
      const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      return `${vendor}_${renderer}`;
    } catch(e) {
      return 'webgl_error';
    }
  }

  getBasicFingerprintDetails() {
    return {
      userAgent: navigator.userAgent,
      screenResolution: `${screen.width}x${screen.height}`,
      colorDepth: screen.colorDepth,
      language: navigator.language,
      platform: navigator.platform,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
  }

  extractFingerprintDetails(components) {
    const details = {};
    const componentMap = {
      'userAgent': 'userAgent', 'screenFrame': 'screenFrame', 'colorDepth': 'colorDepth',
      'deviceMemory': 'deviceMemory', 'hardwareConcurrency': 'hardwareConcurrency',
      'platform': 'platform', 'timezone': 'timezone', 'language': 'language',
      'webglVendor': 'webglVendor', 'webglRenderer': 'webglRenderer', 'canvas': 'canvas', 'audio': 'audio'
    };
    const entries = Array.isArray(components)
      ? components.map(comp => [comp && comp.key, comp && comp.value])
      : Object.entries(components || {}).map(([key, comp]) => [key, comp && comp.value]);

    entries.forEach(([rawKey, value]) => {
      const key = componentMap[rawKey] || rawKey;
      if (value !== undefined && value !== null) {
        details[key] = value;
      }
    });
    details.screenResolution = `${screen.width}x${screen.height}`;
    return details;
  }

  async verifyFingerprint(storedFingerprint) {
    try {
      const result = await this.fpInstance.get();
      const currentFingerprint = result.visitorId;
      return storedFingerprint === currentFingerprint;
    } catch (error) {
      console.warn('Fingerprint verification failed, using stored:', error);
      return true;
    }
  }

  getBurnData() {
    try {
      const data = localStorage.getItem('device_burn_data');
      return data ? JSON.parse(data) : null;
    } catch {
      return null;
    }
  }

  setBurnData(data) {
    localStorage.setItem('device_burn_data', JSON.stringify(data));
    this.burnData = data;
  }

  clearBurnData() {
    localStorage.removeItem('device_burn_data');
    this.burnData = null;
  }

  async getDeviceInfo() {
    await this.initialize();
    return {
      fingerprint: this.fingerprint,
      fingerprintDetails: this.fingerprintDetails,
      userAgent: navigator.userAgent,
      screenResolution: `${screen.width}x${screen.height}`,
      colorDepth: screen.colorDepth,
      language: navigator.language,
      platform: navigator.platform,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      burnData: this.burnData
    };
  }
}

// ============================================================
// MAIN APPLICATION STATE
// ============================================================

const CSRF = "{{ csrf_token }}";
let deviceFingerprint = null;
let currentClerk = null;
let wards = [];
let kits = [];
let records = [];
let isDeviceAuthorized = false;
let currentKitId = null;
let currentWardId = null;
let currentWardName = '';
let currentKitName = '';
let currentKitSerial = '';
let searchTerm = '';

// ============================================================
// UTILITY FUNCTIONS
// ============================================================

function getInitials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function dayName(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-KE', { weekday: 'long' });
}

function displayDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-KE', {
    year: 'numeric', month: 'short', day: 'numeric'
  });
}

function setMsgBox(el, text) {
  if (!el) return;
  const span = el.querySelector('span');
  if (span) span.textContent = text;
  else el.textContent = text;
  el.classList.remove('hidden');
}

function updateLastUpdated() {
  const now = new Date();
  const time = now.toLocaleTimeString('en-KE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const display = document.getElementById('lastUpdated');
  if (display) display.textContent = `Last updated: ${time}`;
}

function showDeviceMessage(message, type = 'error', showCode = true) {
  const container = document.getElementById('device-message-container');
  const code = deviceFingerprint ? deviceFingerprint.fingerprint.substring(0, 16) : 'Unknown';
  let icon = 'ti ti-alert-circle';
  let title = 'Device Not Authorized';
  let cssClass = 'error';
  if (type === 'success') { icon = 'ti ti-check-circle'; title = 'Device Authorized'; cssClass = 'success'; }
  else if (type === 'info') { icon = 'ti ti-info-circle'; title = 'Device Information'; cssClass = 'info'; }
  container.innerHTML = `
      <div class="device-locked ${cssClass}">
          <i class="${icon}"></i>
          <h3>${title}</h3>
          <p>${message}</p>
          ${showCode ? `<div class="lock-code">Device ID: ${code}</div>` : ''}
      </div>`;
  container.classList.remove('hidden');
}

function hideDeviceMessage() {
  document.getElementById('device-message-container').classList.add('hidden');
  document.getElementById('device-message-container').innerHTML = '';
}

function updateDeviceInfoBar(isAuthorized, clerkName = null) {
  const bar = document.getElementById('device-info-bar');
  const statusLabel = document.getElementById('device-status-label');
  const idDisplay = document.getElementById('device-id-display');
  bar.classList.remove('hidden');
  if (isAuthorized) {
    statusLabel.textContent = 'Authorized';
    statusLabel.style.color = 'var(--green-dark)';
    const info = clerkName ? ` - ${clerkName}` : '';
    document.getElementById('device-status-text').textContent = `Device: Authorized${info}`;
  } else {
    statusLabel.textContent = 'Not Authorized';
    statusLabel.style.color = 'var(--error)';
    document.getElementById('device-status-text').textContent = 'Device: Not Authorized';
  }
  if (deviceFingerprint) {
    idDisplay.textContent = `ID: ${deviceFingerprint.fingerprint.substring(0, 12)}...`;
  }
  updateLastUpdated();
}

function populateSelect(selectEl, items, labelProp, valueProp) {
  selectEl.innerHTML = '<option value="">Select</option>';
  items.forEach(item => {
    const option = document.createElement('option');
    option.value = item[valueProp];
    option.textContent = item[labelProp];
    selectEl.appendChild(option);
  });
}

function populateSelectWithSerial(selectEl, items) {
  selectEl.innerHTML = '<option value="">Select kit</option>';
  items.forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;
    const displayText = item.serial_no
      ? `${item.kit_name} (${item.serial_no})`
      : item.kit_name;
    option.textContent = displayText;
    selectEl.appendChild(option);
  });
}

function updateClerkProfile(clerk) {
  const container = document.getElementById('clerk-profile-container');
  if (!clerk) {
    container.classList.add('hidden');
    return;
  }
  container.classList.remove('hidden');
  document.getElementById('clerk-avatar').textContent = getInitials(clerk.name);
  document.getElementById('clerk-name-display').textContent = clerk.name;
  document.getElementById('clerk-ward-display').textContent = clerk.ward_name || 'Ward not assigned';
}

// ============================================================
// DEVICE REGISTRATION & AUTHENTICATION
// ============================================================

async function registerDevice() {
  try {
    const fp = new DeviceFingerprint();
    await fp.initialize();
    deviceFingerprint = fp;
    const deviceInfo = await fp.getDeviceInfo();

    console.log('[clerk-mapping] Registering device...', deviceInfo.fingerprint);

    const response = await fetch('/register-device/', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fingerprint: deviceInfo.fingerprint,
        fingerprint_details: deviceInfo.fingerprintDetails,
        device_info: deviceInfo
      })
    });

    if (!response.ok) {
      const text = await response.text();
      console.error('[clerk-mapping] register-device HTTP error:', response.status, text);
      throw new Error(`Registration failed (HTTP ${response.status})`);
    }

    const data = await response.json();
    console.log('[clerk-mapping] register-device response:', data);

    if (!data.ok && data.error) {
      throw new Error(data.error);
    }

    isDeviceAuthorized = data.is_burned;

    if (!data.is_burned) {
      showDeviceMessage('This device has been deauthorized. Please contact your ICT officer to reauthorize it.', 'error', true);
      updateDeviceInfoBar(false);
      return false;
    }
    if (!data.is_active) {
      showDeviceMessage('This device has been deactivated. Please contact your ICT officer for assistance.', 'error', true);
      updateDeviceInfoBar(false);
      return false;
    }

    hideDeviceMessage();

    if (data.clerk_id) {
      deviceFingerprint.setBurnData({ clerk_id: data.clerk_id, clerk_name: data.clerk_name });
      updateDeviceInfoBar(true, data.clerk_name);
      currentClerk = {
        id: data.clerk_id,
        name: data.clerk_name,
        ward_name: data.ward_name || null
      };
      updateClerkProfile(currentClerk);
      await loadInitialData();
    } else {
      updateDeviceInfoBar(true);
      document.getElementById('identify-card').style.display = 'block';
      await loadInitialData();
    }
    return true;

  } catch (error) {
    console.error('Device initialization failed:', error);
    showDeviceMessage('Device error: ' + error.message + '. Please contact your ICT officer.', 'error', true);
    return false;
  }
}

async function autoBindToClerk(clerkId) {
  try {
    const deviceInfo = await deviceFingerprint.getDeviceInfo();
    const response = await fetch('/auto-bind-clerk/', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clerk_id: clerkId,
        fingerprint: deviceInfo.fingerprint
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.ok) {
      currentClerk = {
        id: data.clerk_id,
        name: data.clerk_name,
        ward_name: data.ward_name || null
      };
      if (deviceFingerprint) {
        deviceFingerprint.setBurnData({
          clerk_id: data.clerk_id,
          clerk_name: data.clerk_name
        });
      }
      updateDeviceInfoBar(true, data.clerk_name);
      updateClerkProfile(currentClerk);
      await loadInitialData();
    } else {
      throw new Error(data.error || 'Auto-bind failed');
    }
  } catch (error) {
    console.error('Auto-bind failed:', error);
    showDeviceMessage('Failed to bind to Clerk: ' + error.message + '. Please contact your ICT officer.', 'error', true);
  }
}

// ============================================================
// DATA LOADING
// ============================================================

async function loadInitialData() {
  const wardSelect = document.getElementById('ward-select');
  const wardError = document.getElementById('ward-error');
  const loadKitsBtn = document.getElementById('load-kits-btn');
  const retryWardsBtn = document.getElementById('retry-wards-btn');

  wardError.classList.add('hidden');
  wardSelect.disabled = false;
  loadKitsBtn.disabled = true;
  retryWardsBtn.style.display = 'none';

  try {
    console.log('[clerk-mapping] Fetching ward list...');
    const wardsResp = await fetch('/ward-list/');

    if (!wardsResp.ok) {
      const errorText = await wardsResp.text();
      console.error('Ward list HTTP error:', wardsResp.status, errorText);
      throw new Error(`HTTP ${wardsResp.status}: ${errorText}`);
    }

    const wardsData = await wardsResp.json();
    console.log('[clerk-mapping] ward-list response:', wardsData);

    if (!wardsData.ok) {
      throw new Error(wardsData.error || 'Unknown error loading wards');
    }

    wards = wardsData.wards || [];
    if (wards.length === 0) {
      throw new Error('No wards found in the system');
    }

    populateSelect(wardSelect, wards, 'name', 'id');
    loadKitsBtn.disabled = false;

  } catch (e) {
    console.error('Failed to load wards:', e);
    const errorMsg = wardError.querySelector('span');
    errorMsg.textContent = e.message || 'Could not load wards. Please check connection and try again.';
    wardError.classList.remove('hidden');
    wardSelect.disabled = true;
    retryWardsBtn.style.display = 'inline-block';
  }
}

async function loadKits() {
  const wardId = document.getElementById('ward-select').value;
  if (!wardId) {
    const kitError = document.getElementById('kit-error');
    if (kitError) setMsgBox(kitError, 'Please select a ward first.');
    return;
  }
  currentWardId = wardId;
  currentWardName = document.getElementById('ward-select').selectedOptions[0]
    ? document.getElementById('ward-select').selectedOptions[0].textContent
    : '';

  const kitSelect = document.getElementById('kit-select');
  kitSelect.innerHTML = '<option value="">Select kit</option>';
  document.getElementById('load-records-btn').disabled = true;
  document.getElementById('kit-selection-card').classList.remove('hidden');
  document.getElementById('records-card').classList.add('hidden');
  document.getElementById('selection-summary').classList.add('hidden');
  const kitError = document.getElementById('kit-error');
  if (kitError) kitError.classList.add('hidden');

  try {
    console.log('[clerk-mapping] Fetching kits for ward:', wardId);
    const resp = await fetch(`/kit-list/?ward_id=${wardId}`);

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }

    const data = await resp.json();
    console.log('[clerk-mapping] kit-list response:', data);

    if (data.error) {
      throw new Error(data.error);
    }

    if (data.ward_name) currentWardName = data.ward_name;

    kits = data.kits || [];
    if (kits.length === 0) {
      kitSelect.innerHTML = '<option value="">No kits assigned to this ward</option>';
      document.getElementById('load-records-btn').disabled = true;
      return;
    }

    populateSelectWithSerial(kitSelect, kits);
    document.getElementById('load-records-btn').disabled = false;

  } catch (e) {
    console.error('Failed to load kits:', e);
    const kitErrorEl = document.getElementById('kit-error');
    if (kitErrorEl) setMsgBox(kitErrorEl, 'Could not load kits. Please try again.');
  }
}

async function loadRecords() {
  const kitId = document.getElementById('kit-select').value;

  if (!kitId) {
    const saveErrors = document.getElementById('save-errors');
    if (saveErrors) setMsgBox(saveErrors, 'Please select a kit first.');
    return;
  }

  currentKitId = kitId;
  const kitOption = document.getElementById('kit-select').selectedOptions[0];
  currentKitName = kitOption ? kitOption.textContent : '';

  const tbody = document.getElementById('records-tbody');
  tbody.innerHTML = '<tr><td colspan="6" class="loading-cell"><i class="ti ti-loader spin"></i> Loading records...</td></tr>';
  document.getElementById('records-card').classList.remove('hidden');

  try {
    const fingerprint = deviceFingerprint ? deviceFingerprint.fingerprint : '';
    // No date param — pulls every date on file for this kit
    let url = `/clerk-records/?kit_id=${kitId}&fingerprint=${encodeURIComponent(fingerprint)}`;

    console.log('[clerk-mapping] Fetching records for kit:', kitId);
    const resp = await fetch(url);

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }

    const data = await resp.json();
    console.log('[clerk-mapping] clerk-records response:', data);

    if (data.error) {
      throw new Error(data.error);
    }

    records = data.records || [];
    currentKitSerial = data.kit_serial || '';
    if (data.kit_name) currentKitName = data.kit_name;

    if (data.clerk) {
      currentClerk = {
        id: data.clerk.id,
        name: data.clerk.name,
        ward_name: data.clerk.ward_name || null
      };
      updateClerkProfile(currentClerk);
      if (data.clerk.ward_name) currentWardName = data.clerk.ward_name;
    }

    searchTerm = '';
    document.getElementById('venue-search').value = '';

    // Show the compact ward/kit summary and collapse the selection form
    document.getElementById('summary-ward-name').textContent = currentWardName || '—';
    document.getElementById('summary-kit-name').textContent = currentKitName || '—';
    const serialEl = document.getElementById('summary-kit-serial');
    serialEl.textContent = currentKitSerial ? `S/N: ${currentKitSerial}` : '';
    serialEl.style.display = currentKitSerial ? 'inline-block' : 'none';

    document.getElementById('identify-card').classList.add('hidden');
    document.getElementById('kit-selection-card').classList.add('hidden');
    document.getElementById('selection-summary').classList.remove('hidden');

    renderRecords();
    updateFabVisibility();

  } catch (e) {
    console.error('Failed to load records:', e);
    tbody.innerHTML = `
      <tr><td colspan="6" class="empty-cell">
        <i class="ti ti-alert-circle" style="font-size:22px;display:block;margin-bottom:6px;"></i>
        Could not load records. Please try again.
      </td></tr>`;
  }
}

// ============================================================
// RENDER RECORDS TABLE
// ============================================================

function renderRecords() {
  const tbody = document.getElementById('records-tbody');

  if (!records.length) {
    tbody.innerHTML = `
      <tr><td colspan="6" class="empty-cell">
        <i class="ti ti-calendar-plus" style="font-size:22px;display:block;margin-bottom:6px;"></i>
        No records yet — use "Add Entry" to create one.
      </td></tr>`;
    updateCounts();
    return;
  }

  const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
  let html = '';
  let visibleCount = 0;

  sorted.forEach(record => {
    const isNew = record.entry_id <= 0;
    const hasVenue = record.venue && record.venue.trim() !== '';
    const isLocked = !isNew && hasVenue; // saved entries open read-only until "Edit" is clicked

    const statusClass = isNew ? 'pending' : (hasVenue ? 'saved' : 'pending');
    const statusLabel = isNew ? 'New' : (hasVenue ? 'Saved' : 'Pending');

    const matchesSearch = !searchTerm || (record.venue || '').toLowerCase().includes(searchTerm.toLowerCase());
    const show = matchesSearch;
    if (show) visibleCount++;

    const venueVal = (record.venue || '').replace(/"/g, '&quot;');

    html += `
      <tr class="${isNew ? 'new-row' : ''}" data-entry-id="${record.entry_id}" data-date="${record.date}" style="${show ? '' : 'display:none;'}">
        <td><input class="date-cell-input" type="date" value="${record.date}" ${isNew ? '' : 'disabled'}></td>
        <td class="day-cell">${dayName(record.date)}</td>
        <td>
          <input class="venue-cell-input" data-entry-id="${record.entry_id}"
                 value="${venueVal}" placeholder="Enter venue name"
                 data-original="${venueVal}" ${isLocked ? 'readonly' : ''}>
        </td>
        <td class="time-cell">${FIXED_TIME_LABEL}</td>
        <td class="status-cell"><span class="entry-status ${statusClass}">${statusLabel}</span></td>
        <td class="action-cell">
          <button class="btn-secondary small row-edit-btn edit-entry-btn" data-entry-id="${record.entry_id}"
                  style="${isLocked ? '' : 'display:none;'}">
            <i class="ti ti-pencil"></i> Edit
          </button>
          <button class="btn-primary small row-save-btn save-entry-btn" data-entry-id="${record.entry_id}"
                  style="${isLocked ? 'display:none;' : ''}">
            <i class="ti ti-device-floppy"></i> Save
          </button>
          <span class="save-feedback" id="feedback-${record.entry_id}"></span>
        </td>
      </tr>`;
  });

  tbody.innerHTML = html;

  tbody.querySelectorAll('.save-entry-btn').forEach(btn => {
    btn.addEventListener('click', () => saveSingleEntry(parseInt(btn.dataset.entryId)));
  });

  tbody.querySelectorAll('.edit-entry-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      const entryId = this.dataset.entryId;
      const row = this.closest('tr');
      const input = row.querySelector('.venue-cell-input');
      const saveBtn = row.querySelector('.save-entry-btn');
      const badge = row.querySelector('.entry-status');

      input.readOnly = false;
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      this.style.display = 'none';
      saveBtn.style.display = '';
      if (badge) {
        badge.textContent = 'Editing';
        badge.className = 'entry-status editing';
      }
    });
  });

  tbody.querySelectorAll('.venue-cell-input').forEach(input => {
    input.addEventListener('input', function () {
      const changed = this.value.trim() !== (this.dataset.original || '');
      this.classList.toggle('changed', changed);
      updateCounts();
    });
  });

  tbody.querySelectorAll('.date-cell-input').forEach(input => {
    input.addEventListener('change', function () {
      const row = this.closest('tr');
      row.dataset.date = this.value;
      row.querySelector('.day-cell').textContent = dayName(this.value);
    });
  });

  updateCounts();
  updateFilterLabel(visibleCount);
  updateLastUpdated();
}

// ============================================================
// COUNTS
// ============================================================

function updateCounts() {
  const rows = document.querySelectorAll('#records-tbody tr[data-entry-id]');
  let saved = 0;
  let pending = 0;

  rows.forEach(row => {
    const input = row.querySelector('.venue-cell-input');
    if (input && input.value && input.value.trim()) {
      saved++;
    } else {
      pending++;
    }
  });

  const savedEl = document.getElementById('savedCount');
  const pendingEl = document.getElementById('pendingCount');
  if (savedEl) savedEl.textContent = saved;
  if (pendingEl) pendingEl.textContent = pending;
}

function updateFilterLabel(visibleCount) {
  const filterLabel = document.getElementById('filterLabel');
  if (!filterLabel) return;
  if (!searchTerm) {
    filterLabel.textContent = 'All records';
  } else {
    filterLabel.textContent = `${visibleCount} matching "${searchTerm}"`;
  }
}

// ============================================================
// SEARCH FILTER
// ============================================================

function applyRowVisibility() {
  const rows = document.querySelectorAll('#records-tbody tr[data-entry-id]');
  let visibleCount = 0;

  rows.forEach(row => {
    const input = row.querySelector('.venue-cell-input');
    const venue = input ? input.value : '';
    const show = !searchTerm || venue.toLowerCase().includes(searchTerm.toLowerCase());

    row.style.display = show ? '' : 'none';
    if (show) visibleCount++;
  });

  updateFilterLabel(visibleCount);
}

document.getElementById('venue-search').addEventListener('input', function () {
  searchTerm = this.value.trim();
  document.getElementById('clear-search-btn').classList.toggle('show', !!searchTerm);
  applyRowVisibility();
});

document.getElementById('clear-search-btn').addEventListener('click', function () {
  searchTerm = '';
  document.getElementById('venue-search').value = '';
  this.classList.remove('show');
  applyRowVisibility();
});

// ============================================================
// ADD ROW
// ============================================================

function addNewRow() {
  const tempId = -Date.now(); // unique negative temp id for a not-yet-saved row
  records.unshift({ entry_id: tempId, date: todayStr(), venue: '', is_new: true });
  searchTerm = '';
  document.getElementById('venue-search').value = '';
  document.getElementById('clear-search-btn').classList.remove('show');
  renderRecords();

  // Scroll to top so the new row (always inserted first) is immediately visible,
  // then focus its venue input.
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => {
    const row = document.querySelector(`tr[data-entry-id="${tempId}"]`);
    if (row) {
      const input = row.querySelector('.venue-cell-input');
      if (input) input.focus();
    }
  }, 250);
}

document.getElementById('add-row-btn-top').addEventListener('click', addNewRow);
document.getElementById('fab-add-btn').addEventListener('click', addNewRow);

document.getElementById('scroll-top-btn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('change-selection-btn').addEventListener('click', () => {
  document.getElementById('selection-summary').classList.add('hidden');
  document.getElementById('records-card').classList.add('hidden');
  document.getElementById('identify-card').classList.remove('hidden');
  document.getElementById('kit-selection-card').classList.remove('hidden');
  updateFabVisibility();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Show the floating Add button once the records table is on screen,
// so it stays reachable no matter how far the clerk scrolls down a long list.
function updateFabVisibility() {
  const fab = document.getElementById('fab-add-btn');
  const card = document.getElementById('records-card');
  if (!fab || !card) return;
  const cardVisible = !card.classList.contains('hidden');
  fab.classList.toggle('hidden', !cardVisible);
}

window.addEventListener('scroll', updateFabVisibility);

// ============================================================
// SAVE SINGLE ROW
// ============================================================

async function saveSingleEntry(entryId) {
  const row = document.querySelector(`tr[data-entry-id="${entryId}"]`);
  if (!row) return;

  const input = row.querySelector('.venue-cell-input');
  const dateInput = row.querySelector('.date-cell-input');
  const feedback = document.getElementById(`feedback-${entryId}`);
  const btn = row.querySelector('.save-entry-btn');

  const venue = input.value.trim();
  const rowDate = dateInput.value || row.dataset.date;

  if (!venue) {
    if (feedback) {
      feedback.innerHTML = '<i class="ti ti-alert-circle" style="color:var(--error);"></i> Venue required';
      feedback.className = 'save-feedback error';
    }
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader spin"></i> Saving...';
  if (feedback) {
    feedback.innerHTML = '<i class="ti ti-loader spin"></i> Saving...';
    feedback.className = 'save-feedback';
  }

  try {
    const requestBody = {
      kit_id: parseInt(currentKitId),
      ward_id: currentWardId ? parseInt(currentWardId) : undefined,
      fingerprint: deviceFingerprint ? deviceFingerprint.fingerprint : undefined,
      updates: [{
        entry_id: entryId,
        kit_id: parseInt(currentKitId),
        date: rowDate,
        venue: venue
      }]
    };

    const resp = await fetch('/save-clerk-venues/', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });

    if (!resp.ok) {
      const errorText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errorText}`);
    }

    const data = await resp.json();
    console.log('[clerk-mapping] save response:', data);

    if (data.ok) {
      if (feedback) {
        feedback.innerHTML = '<i class="ti ti-check" style="color:var(--green-dark);"></i> Saved!';
        feedback.className = 'save-feedback success';
      }
      // Reload so a temp/new row becomes a real persisted row with a real id
      await loadRecords();
      if (currentFilter !== 'all') filterByDate(currentFilter);
    } else {
      throw new Error((data.errors && data.errors[0]) || data.error || 'Could not save venue.');
    }
  } catch (e) {
    console.error('Save error:', e);
    if (feedback) {
      feedback.innerHTML = `<i class="ti ti-alert-circle" style="color:var(--error);"></i> ${e.message || 'Save failed'}`;
      feedback.className = 'save-feedback error';
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-device-floppy"></i> Save';
  }
}

// ============================================================
// EVENT LISTENERS — ward / kit selection
// ============================================================

document.getElementById('ward-select').addEventListener('change', () => {
  const selected = document.getElementById('ward-select').value;
  document.getElementById('load-kits-btn').disabled = !selected;
  if (!selected) {
    document.getElementById('kit-selection-card').classList.add('hidden');
    document.getElementById('records-card').classList.add('hidden');
    document.getElementById('kit-select').innerHTML = '<option value="">Select kit</option>';
    updateFabVisibility();
  }
});

document.getElementById('load-kits-btn').addEventListener('click', loadKits);

document.getElementById('kit-select').addEventListener('change', () => {
  const selected = document.getElementById('kit-select').value;
  document.getElementById('load-records-btn').disabled = !selected;
  if (!selected) {
    document.getElementById('records-card').classList.add('hidden');
    updateFabVisibility();
  }
});

document.getElementById('load-records-btn').addEventListener('click', loadRecords);

document.getElementById('retry-wards-btn').addEventListener('click', async () => {
  const retryBtn = document.getElementById('retry-wards-btn');
  retryBtn.disabled = true;
  retryBtn.innerHTML = '<i class="ti ti-loader spin"></i> Retrying...';
  try {
    await loadInitialData();
  } finally {
    retryBtn.disabled = false;
    retryBtn.innerHTML = 'Retry Wards';
  }
});

// ============================================================
// AUTO-SAVE (any unsaved row) EVERY 30s
// ============================================================

let refreshCountdown = 30;

setInterval(() => {
  refreshCountdown--;
  if (refreshCountdown <= 0) {
    refreshCountdown = 30;
    const changedInput = document.querySelector('.venue-cell-input.changed');
    if (changedInput) {
      const entryId = parseInt(changedInput.dataset.entryId);
      saveSingleEntry(entryId);
    }
  }
}, 1000);

// ============================================================
// KEYBOARD SHORTCUT: Ctrl/Cmd+S saves the first changed row
// ============================================================

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    const changedInput = document.querySelector('.venue-cell-input.changed');
    if (changedInput) {
      const entryId = parseInt(changedInput.dataset.entryId);
      saveSingleEntry(entryId);
    }
  }
});

// ============================================================
// INITIALIZATION
// ============================================================

async function initializeApp() {
  console.log('[clerk-mapping] Initializing app...');
  const deviceOk = await registerDevice();
  if (deviceOk) {
    console.log('[clerk-mapping] Device registered successfully');
    if (!currentClerk) {
      console.log('[clerk-mapping] No clerk bound. Waiting for manual selection.');
    }
  } else {
    console.error('[clerk-mapping] Device registration failed');
  }
}

initializeApp();
</script>
