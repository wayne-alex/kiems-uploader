<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIEMS SuperAdmin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section img {
            max-width: 120px;
            height: auto;
            object-fit: contain;
        }

        .logo-section .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.5px;
            margin-top: 8px;
        }

        .logo-section .brand-sub {
            font-size: 14px;
            color: #8e8e93;
            font-weight: 400;
        }

        .login-card {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            border: 0.5px solid rgba(0, 0, 0, 0.06);
        }

        .login-header {
            margin-bottom: 28px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #3a3a3c;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f9f9fb;
            border: 0.5px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #90EE90;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(144, 238, 144, 0.15);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 0 0 14px;
            color: #8e8e93;
            font-size: 18px;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: #000000;
            background: transparent;
            border-radius: 10px;
        }

        .form-group .input-wrapper input::placeholder {
            color: #c4c4c6;
        }

        .form-group .input-wrapper .toggle-password {
            padding: 0 14px 0 0;
            color: #8e8e93;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: #3a3a3c;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-options .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #3a3a3c;
            cursor: pointer;
        }

        .form-options .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #90EE90;
            cursor: pointer;
        }

        .form-options .forgot-link {
            font-size: 14px;
            color: #5856d6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .form-options .forgot-link:hover {
            color: #4846c6;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #90EE90;
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(144, 238, 144, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: #7fe07f;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(144, 238, 144, 0.35);
        }

        .btn-login:active {
            background: #6fd86f;
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(144, 238, 144, 0.2);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            animation: slideDown 0.3s ease;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 0.5px solid #a5d6a7;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 0.5px solid #ef9a9a;
        }

        .alert-warning {
            background: #fff8e1;
            color: #f57f17;
            border: 0.5px solid #ffe082;
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border: 0.5px solid #90caf9;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8e8e93;
        }

        .login-footer a {
            color: #5856d6;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Security Badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 12px;
            color: #a1a1a6;
        }

        .security-badge i {
            font-size: 14px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Logo -->
        <div class="logo-section">
            <img src="https://cvr.iebc.or.ke/images/logoiebc.png" alt="IEBC Logo">
            <div class="brand-name">KIEMS Portal</div>
            <div class="brand-sub">SuperAdmin Control Panel</div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to manage the election system</p>
            </div>

            <!-- Messages -->
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-exclamation-circle-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" action="{% url 'superadmin:login' %}" id="loginForm">
                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@iebc.or.ke"
                            value="{{ email|default:'' }}"
                            required
                            autocomplete="email"
                            autofocus
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-lock"></i></span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <span class="toggle-password" onclick="togglePassword()">
                            <i class="bi bi-eye-slash" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="remember">
                        Remember me
                    </label>
                    <a href="{% url 'superadmin:password_reset' %}" class="forgot-link">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Sign In</span>
                    <span class="spinner" id="btnSpinner"></span>
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>Protected by <strong>IEBC</strong> | v2.0.1</p>
            </div>

            <div class="security-badge">
                <i class="bi bi-shield-check"></i>
                <span>Secure connection • SSL Encrypted</span>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'bi bi-eye';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'bi bi-eye-slash';
            }
        }

        // Form submission loading state
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            const text = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            btn.disabled = true;
            text.textContent = 'Signing in...';
            spinner.style.display = 'inline-block';
        });

        // Enter key to trigger login
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (document.activeElement && document.activeElement.closest('form') === form) {
                    form.submit();
                }
            }
        });

        // Pre-fill demo credentials (for development only - remove in production)
        // Uncomment to auto-fill for testing
        // document.getElementById('email').value = 'admin@iebc.or.ke';
        // document.getElementById('password').value = 'admin123';
    </script>
</body>
</html>
