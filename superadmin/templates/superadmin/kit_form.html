{% extends "home/base.html" %}
{% block title %}{{ title }} | KIEMS Admin{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-size:24px; font-weight:700;">{{ title }}</h2>
        <a href="{% url 'home:kit_list' %}" style="color:#5856d6; text-decoration:none;">← Back</a>
    </div>
    
    <div style="background:#fff; border-radius:12px; border:0.5px solid rgba(0,0,0,0.08); padding:24px;">
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom:16px;">
                <label style="display:block; font-size:13px; font-weight:600; color:#3a3a3c; margin-bottom:4px;">Kit Name</label>
                {{ form.kit_name }}
            </div>
            
            <div style="margin-bottom:16px;">
                <label style="display:block; font-size:13px; font-weight:600; color:#3a3a3c; margin-bottom:4px;">Serial Number</label>
                {{ form.serial_no }}
            </div>
            
            <div style="margin-bottom:16px;">
                <label style="display:block; font-size:13px; font-weight:600; color:#3a3a3c; margin-bottom:4px;">Status</label>
                {{ form.status }}
            </div>
            
            <div style="margin-bottom:16px;">
                <label style="display:block; font-size:13px; font-weight:600; color:#3a3a3c; margin-bottom:4px;">Ward</label>
                {{ form.ward }}
            </div>
            
            <div style="margin-bottom:24px;">
                <label style="display:block; font-size:13px; font-weight:600; color:#3a3a3c; margin-bottom:4px;">Assigned Clerks</label>
                {{ form.assigned_clerks }}
                <p style="font-size:12px; color:#8e8e93; margin-top:4px;">Hold Ctrl/Cmd to select multiple</p>
            </div>
            
            <button type="submit" style="width:100%; padding:14px; background:#90EE90; border:none; border-radius:12px; font-size:17px; font-weight:600; cursor:pointer;">
                {% if form.instance.pk %}Update{% else %}Create{% endif %} Kit
            </button>
        </form>
    </div>
</div>

<style>
    .form-input {
        width:100%;
        padding:12px 16px;
        border:0.5px solid rgba(0,0,0,0.08);
        border-radius:10px;
        font-size:16px;
        background:#f9f9fb;
        transition:all 0.2s;
        font-family:inherit;
    }
    .form-input:focus {
        outline:none;
        border-color:#90EE90;
        background:#fff;
        box-shadow:0 0 0 3px rgba(144,238,144,0.15);
    }
    select[multiple] {
        min-height:100px;
    }
</style>
{% endblock %}
