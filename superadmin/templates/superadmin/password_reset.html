<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - KIEMS SuperAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .reset-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section img {
            max-width: 100px;
            height: auto;
            object-fit: contain;
        }

        .logo-section .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.5px;
            margin-top: 6px;
        }

        .reset-card {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            border: 0.5px solid rgba(0, 0, 0, 0.06);
        }

        .reset-header {
            margin-bottom: 28px;
            text-align: center;
        }

        .reset-header .icon {
            font-size: 48px;
            color: #5856d6;
            display: block;
            margin-bottom: 12px;
        }

        .reset-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .reset-header p {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 4px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #3a3a3c;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f9f9fb;
            border: 0.5px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #90EE90;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(144, 238, 144, 0.15);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 0 0 14px;
            color: #8e8e93;
            font-size: 18px;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: #000000;
            background: transparent;
            border-radius: 10px;
        }

        .form-group .input-wrapper input::placeholder {
            color: #c4c4c6;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #5856d6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(88, 86, 214, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #4846c6;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(88, 86, 214, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #3a3a3c;
            border: 0.5px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #f2f2f7;
        }

        .messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            animation: slideDown 0.3s ease;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 0.5px solid #a5d6a7;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 0.5px solid #ef9a9a;
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border: 0.5px solid #90caf9;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e93;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 0.5px;
            background: #c6c6c8;
        }

        .divider::before {
            margin-right: 16px;
        }

        .divider::after {
            margin-left: 16px;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-wrapper">
        <div class="logo-section">
            <img src="https://cvr.iebc.or.ke/images/logoiebc.png" alt="IEBC Logo">
            <div class="brand-name">KIEMS Portal</div>
        </div>

        <div class="reset-card">
            <div class="reset-header">
                <span class="icon"><i class="bi bi-key"></i></span>
                <h1>Reset Password</h1>
                <p>Enter your email address and we'll send you instructions to reset your password.</p>
            </div>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-exclamation-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" action="{% url 'superadmin:password_reset' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@iebc.or.ke"
                            required
                            autocomplete="email"
                            autofocus
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-send"></i>
                    Send Reset Link
                </button>
            </form>

            <div class="divider">or</div>

            <a href="{% url 'superadmin:login' %}" class="btn-secondary">
                <i class="bi bi-arrow-left"></i>
                Back to Sign In
            </a>
        </div>
    </div>
</body>
</html>
